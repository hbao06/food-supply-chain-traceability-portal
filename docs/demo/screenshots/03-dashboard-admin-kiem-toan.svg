  <text x="760" y="445" fill="#334155" font-size="12.5">Nguyễn Văn An (Farmer)</text>
  <rect x="930" y="432" width="130" height="20" rx="4" fill="#f1f5f9"/>
  <text x="936" y="446" fill="#475569" font-size="11" font-family="monospace">a718b9c2...47e812d</text>
  <text x="1150" y="445" fill="#16a34a" font-size="12" font-weight="750" text-anchor="end">✓ Hợp lệ</text>

