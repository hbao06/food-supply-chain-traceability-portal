    <text x="244" y="50" fill="#16a34a" font-size="22" font-weight="800">100%</text>
    <text x="310" y="48" fill="#64748b" font-size="11">hash chain verified</text>

    <rect x="460" y="0" width="215" height="70" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="474" y="22" fill="#64748b" font-size="10.5" font-weight="750">THUẬT TOÁN BĂM</text>
    <text x="474" y="50" fill="#0f172a" font-size="22" font-weight="800">SHA-256</text>
    <text x="580" y="48" fill="#64748b" font-size="11">NIST FIPS 180-4</text>

    <rect x="690" y="0" width="220" height="70" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="704" y="22" fill="#64748b" font-size="10.5" font-weight="750">CẤP QUYỀN GIÁM SÁT</text>
    <text x="704" y="50" fill="#1e40af" font-size="18" font-weight="800">ADMIN ONLY</text>
    <text x="704" y="64" fill="#64748b" font-size="10">quyền audit:read</text>
  </g>

  <!-- Table -->
  <rect x="264" y="375" width="910" height="350" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="264" y="375" width="910" height="40" fill="#f8fafc" rx="8"/>
  <text x="284" y="400" fill="#475569" font-size="12" font-weight="700">ID</text>
