<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" style="background:#0f172a;font-family:system-ui,-apple-system,sans-serif">
  <!-- Dark Blueprint / Cryptographic Style for Hash Verification -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="750" fill="#0f172a"/>
  <!-- Decorative Grid Lines -->
  <line x1="100" y1="0" x2="100" y2="750" stroke="#1e293b" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="750" stroke="#1e293b" stroke-width="1"/>
  <line x1="500" y1="0" x2="500" y2="750" stroke="#1e293b" stroke-width="1"/>
  <line x1="700" y1="0" x2="700" y2="750" stroke="#1e293b" stroke-width="1"/>
  <line x1="900" y1="0" x2="900" y2="750" stroke="#1e293b" stroke-width="1"/>
  <line x1="1100" y1="0" x2="1100" y2="750" stroke="#1e293b" stroke-width="1"/>

  <!-- Centered Verification Shield & Certificate -->
  <rect x="250" y="60" width="700" height="630" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2" filter="drop-shadow(0 25px 40px rgba(0,0,0,0.6))"/>

  <!-- Glowing Shield Icon -->
  <circle cx="600" cy="150" r="48" fill="#064e3b" stroke="#10b981" stroke-width="3"/>
  <text x="582" y="166" fill="#34d399" font-size="44">🛡️</text>

  <!-- Big Title -->
  <text x="600" y="240" fill="#f8fafc" font-size="24" font-weight="800" text-anchor="middle">CHỨNG NHẬN TOÀN VẸN CHUỖI BĂM MẬT MÃ</text>
  <text x="600" y="265" fill="#94a3b8" font-size="13.5" text-anchor="middle">Tiêu chuẩn kiểm toán dữ liệu bất biến: NIST FIPS 180-4 Secure Hash Standard (SHA-256)</text>

  <!-- Status Pill -->
  <rect x="490" y="285" width="220" height="32" rx="16" fill="#065f46" stroke="#34d399"/>
  <text x="600" y="306" fill="#a7f3d0" font-size="12" font-weight="800" letter-spacing="1" text-anchor="middle">✓ VERIFIED: 100% VALID</text>

  <!-- Hash Blocks Chain Diagram -->
  <g transform="translate(290, 345)">
    <!-- Block 1 -->
    <rect x="0" y="0" width="180" height="90" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="12" y="20" fill="#34d399" font-size="11" font-weight="700">BLOCK #501 (CREATE)</text>
    <text x="12" y="38" fill="#64748b" font-size="10">Prev: 00000000...00</text>
    <text x="12" y="56" fill="#a7f3d0" font-size="10" font-family="monospace">Hash: a718b9c2...12d</text>
    <text x="12" y="78" fill="#10b981" font-size="10" font-weight="bold">✓ Chain Link OK</text>

    <!-- Arrow 1 -> 2 -->
    <line x1="180" y1="45" x2="225" y2="45" stroke="#10b981" stroke-width="2"/>
    <polygon points="225,41 233,45 225,49" fill="#10b981"/>

    <!-- Block 2 -->
    <rect x="230" y="0" width="180" height="90" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="242" y="20" fill="#34d399" font-size="11" font-weight="700">BLOCK #502 (EVENT)</text>
    <text x="242" y="38" fill="#64748b" font-size="10">Prev: a718b9c2...12d</text>
    <text x="242" y="56" fill="#a7f3d0" font-size="10" font-family="monospace">Hash: c829e1fa...df74</text>
    <text x="242" y="78" fill="#10b981" font-size="10" font-weight="bold">✓ Chain Link OK</text>

    <!-- Arrow 2 -> 3 -->
    <line x1="410" y1="45" x2="445" y2="45" stroke="#10b981" stroke-width="2"/>
    <polygon points="445,41 453,45 445,49" fill="#10b981"/>

    <!-- Block 3 -->
    <rect x="450" y="0" width="170" height="90" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="462" y="20" fill="#34d399" font-size="11" font-weight="700">BLOCK #505 (SHIPPED)</text>
    <text x="462" y="38" fill="#64748b" font-size="10">Prev: b192847a...283</text>
    <text x="462" y="56" fill="#a7f3d0" font-size="10" font-family="monospace">Hash: f029384b...a019</text>
    <text x="462" y="78" fill="#10b981" font-size="10" font-weight="bold">✓ Chain Link OK</text>
  </g>

  <!-- Metrics Grid -->
  <rect x="290" y="465" width="620" height="110" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="315" y="495" fill="#64748b" font-size="11.5" font-weight="700">SỐ BẢN GHI ĐÃ TÍNH TOÁN:</text>
  <text x="315" y="525" fill="#ffffff" font-size="22" font-weight="800">24 / 24 BẢN GHI</text>
  <text x="315" y="545" fill="#10b981" font-size="11">Khớp chính xác 100%</text>

  <text x="615" y="495" fill="#64748b" font-size="11.5" font-weight="700">THUẬT TOÁN KÝ BẢO VỆ:</text>
  <text x="615" y="525" fill="#ffffff" font-size="22" font-weight="800">HMAC-SHA256</text>
  <text x="615" y="545" fill="#34d399" font-size="11">Chống sửa đổi từ tầng CSDL</text>

  <text x="600" y="615" fill="#94a3b8" font-size="12" text-anchor="middle">Kết luận kiểm toán: Dữ liệu nguồn gốc hoàn toàn nguyên vẹn, không có bất kỳ dấu hiệu can thiệp bất hợp pháp.</text>

  <rect x="480" y="635" width="240" height="38" rx="6" fill="#10b981"/>
  <text x="600" y="659" fill="#0f172a" font-size="13" font-weight="800" text-anchor="middle">Đóng chứng nhận kiểm toán</text>
</svg>
