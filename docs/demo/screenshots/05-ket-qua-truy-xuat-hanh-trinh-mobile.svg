  <text x="175" y="150" fill="#1e293b" font-size="10.5" font-weight="700">BATCH-2026-0006</text>

  <text x="40" y="185" fill="#0f172a" font-size="19" font-weight="800">Bưởi Da Xanh Bến Tre Loại 1</text>
