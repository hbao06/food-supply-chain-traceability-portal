<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 850" width="420" height="850" style="background:#0f172a;font-family:system-ui,-apple-system,sans-serif">
  <!-- Mobile Device Frame -->
  <rect x="10" y="10" width="400" height="830" rx="40" fill="#ffffff" stroke="#334155" stroke-width="4"/>
