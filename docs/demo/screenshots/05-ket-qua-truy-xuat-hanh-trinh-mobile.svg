  <g transform="translate(25, 625)">
    <line x1="20" y1="20" x2="20" y2="70" stroke="#86efac" stroke-width="2"/>
    <circle cx="20" cy="20" r="14" fill="#16a34a"/>
    <text x="16" y="24" fill="#fff" font-size="10" font-weight="bold">5</text>
