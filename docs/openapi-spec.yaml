openapi: 3.1.0

info:
  title: Food Supply Chain Traceability & Provenance API
  description: |
    REST API for the Food Supply Chain Traceability & Provenance Portal.

    Authorized supply chain participants create batches and record supply chain
    events. Consumers view public provenance information by scanning a QR code.

    Naming follows the Class Diagram (docs/class-diagram): camelCase fields,
    auto-increment integer identifiers (as in SRS/ERD), and the shared enums Role and EventType.
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Auth
    description: Registration, login and current user
  - name: Batches
    description: Batch management
  - name: Events
    description: Supply chain events of a batch
  - name: Trace
    description: Internal timeline, QR code and public provenance
  - name: Admin
    description: Users, organizations and audit log (ADMIN only)

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new account
      description: |
        The role ADMIN cannot be chosen at registration and the organization is
        assigned later by an Admin. The new account has status PENDING until an
        Admin activates it.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login to the system
      description: Only accounts with status ACTIVE can log in. PENDING and LOCKED accounts get 403.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/me:
    get:
      tags: [Auth]
      summary: Get the current user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    patch:
      tags: [Auth]
      summary: Update the current user's profile
      description: |
        Only `name` can be changed. Email, role, organization and status are managed by an Admin
        (sending them returns 400). The change is written to the audit log.
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /batches:
    post:
      tags: [Batches]
      summary: Create a new batch
      description: |
        Creates the batch, its QR code and the CREATED event in one transaction.
        Only FARMER can create batches.
      operationId: createBatch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBatchRequest"
      responses:
        "201":
          description: Batch created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

    get:
      tags: [Batches]
      summary: List and search batches
      description: FARMER sees only batches of their own organization; ADMIN sees all.
      operationId: listBatches
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter by current status
          schema:
            $ref: "#/components/schemas/EventType"
        - name: q
          in: query
          description: Search by product name or batch code
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Page of batches (empty items if nothing matches)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /batches/{batchId}:
    get:
      tags: [Batches]
      summary: Get batch details
      operationId: getBatch
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          description: Batch details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Batches]
      summary: Update batch information
      description: |
        Only an ACTIVE FARMER of the organization that owns the batch can update it,
        and only while currentStatus is CREATED (otherwise 409).
        Changes are written to the audit log.
      operationId: updateBatch
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBatchRequest"
      responses:
        "200":
          description: Batch updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Batch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /batches/{batchId}/events:
    post:
      tags: [Events]
      summary: Record a supply chain event
      description: |
        DISTRIBUTOR records TRANSPORTED, RECEIVED and SHIPPED.
        PROCESSOR records PROCESSED and PACKAGED.
        The event must follow the valid sequence
        CREATED, TRANSPORTED, RECEIVED, PROCESSED, PACKAGED, SHIPPED.
        The event and the new batch status are saved in one transaction.
      operationId: createSupplyChainEvent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplyChainEvent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

    get:
      tags: [Events]
      summary: List events of a batch
      operationId: listSupplyChainEvents
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          description: Events ordered by timestamp ascending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplyChainEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /batches/{batchId}/timeline:
    get:
      tags: [Trace]
      summary: Get the internal timeline of a batch
      description: Batch information and all events ordered from oldest to newest.
      operationId: getTimeline
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          description: Timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /batches/{batchId}/qr:
    get:
      tags: [Trace]
      summary: Get the QR code of a batch
      description: The QR code is created together with the batch.
      operationId: getQRCode
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BatchId"
      responses:
        "200":
          description: QR code information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QRCode"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /users:
    get:
      tags: [Admin]
      summary: List users
      operationId: listUsers
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/AccountStatus"
        - name: role
          in: query
          schema:
            $ref: "#/components/schemas/Role"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{userId}/role:
    patch:
      tags: [Admin]
      summary: Change the role of a user
      description: The role must match the type of the user's organization (409 otherwise). The last active ADMIN cannot be demoted.
      operationId: changeUserRole
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRoleRequest"
      responses:
        "200":
          description: Role changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/{userId}/organization:
    patch:
      tags: [Admin]
      summary: Assign a user to an organization
      description: The organization type must match the user's role (409 otherwise). ADMIN accounts cannot belong to an organization.
      operationId: assignUserOrganization
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignOrganizationRequest"
      responses:
        "200":
          description: Organization assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /users/{userId}/status:
    patch:
      tags: [Admin]
      summary: Approve, lock or unlock a user
      description: |
        ACTIVE approves a PENDING account or unlocks a LOCKED one. LOCKED locks the account.
        A non-admin user needs an organization before becoming ACTIVE, and the last
        active ADMIN cannot be locked (409 in both cases).
      operationId: changeUserStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeStatusRequest"
      responses:
        "200":
          description: Status changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations:
    get:
      tags: [Admin]
      summary: List organizations
      operationId: listOrganizations
      security:
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/OrganizationType"
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Admin]
      summary: Create an organization
      operationId: createOrganization
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /organizations/{organizationId}:
    patch:
      tags: [Admin]
      summary: Update an organization
      description: |
        Organizations cannot be deleted. The type cannot change once the organization
        has members or batches (409). Name and type must be unique together (409).
      operationId: updateOrganization
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /audit-logs:
    get:
      tags: [Admin]
      summary: Search the audit log
      description: Read-only. Entries are written by the backend in the same transaction as the change.
      operationId: listAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - name: entityType
          in: query
          schema:
            $ref: "#/components/schemas/AuditEntityType"
        - name: entityId
          in: query
          schema:
            type: integer
            format: int64
        - name: actorId
          in: query
          schema:
            type: integer
            format: int64
        - name: action
          in: query
          schema:
            $ref: "#/components/schemas/AuditAction"
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Page of audit entries, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /trace/{qrToken}:
    get:
      tags: [Trace]
      summary: Public provenance by QR token
      description: |
        No login required. The server verifies the HMAC signature of the token
        and returns only public data. An invalid or unknown token returns 404.
      operationId: getPublicTrace
      security: []
      parameters:
        - name: qrToken
          in: path
          required: true
          description: Signed token carried by the QR code
          schema:
            type: string
      responses:
        "200":
          description: Public provenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTrace"
        "404":
          $ref: "#/components/responses/NotFound"

  /trace/code/{batchCode}:
    get:
      tags: [Trace]
      summary: Public provenance by batch code
      description: |
        No login required. Consumer types the batch code printed on the product
        instead of scanning the QR code. Returns the same public data as
        GET /trace/{qrToken}. An unknown code returns 404.
      operationId: getPublicTraceByCode
      security: []
      parameters:
        - name: batchCode
          in: path
          required: true
          description: Human-readable unique batch code
          schema:
            type: string
            example: BATCH-2026-0001
      responses:
        "200":
          description: Public provenance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicTrace"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BatchId:
      name: batchId
      in: path
      required: true
      description: Unique identifier of the batch
      schema:
        type: integer
        format: int64

    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: integer
        format: int64

    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Invalid or missing input data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: VALIDATION_ERROR
            message: Invalid request data
            details:
              - field: quantity
                message: quantity must be greater than 0
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: UNAUTHORIZED
            message: Authentication required
    Forbidden:
      description: Authenticated but not allowed to perform this action
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: FORBIDDEN
            message: Insufficient permissions
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: NOT_FOUND
            message: Resource not found
    Conflict:
      description: Duplicate value or invalid status sequence
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: INVALID_SEQUENCE
            message: Event PACKAGED is not allowed after status CREATED

  schemas:
    Role:
      type: string
      description: Roles stored in the users table. Consumers have no account.
      enum: [FARMER, DISTRIBUTOR, PROCESSOR, ADMIN]

    AccountStatus:
      type: string
      description: |
        PENDING: registered, waiting for an Admin to activate.
        ACTIVE: can log in. LOCKED: locked by an Admin.
      enum: [PENDING, ACTIVE, LOCKED]

    EventType:
      type: string
      description: Used for both the event type and the current status of a batch.
      enum: [CREATED, TRANSPORTED, RECEIVED, PROCESSED, PACKAGED, SHIPPED]

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Stable machine-readable code. Used so the UI can pick a message:
            VALIDATION_ERROR, INVALID_JSON (400); UNAUTHORIZED, INVALID_CREDENTIALS,
            INVALID_TOKEN, TOKEN_EXPIRED (401); FORBIDDEN, ACCOUNT_PENDING, ACCOUNT_LOCKED (403);
            NOT_FOUND (404); EMAIL_EXISTS, CONFLICT, INVALID_SEQUENCE (409);
            PAYLOAD_TOO_LARGE (413); INTERNAL_ERROR (500).
          example: VALIDATION_ERROR
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    RegisterRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
          example: Nguyen Van A
        email:
          type: string
          format: email
          example: farmer@example.com
        password:
          type: string
          format: password
          minLength: 8
        role:
          type: string
          description: ADMIN cannot be chosen at registration.
          enum: [FARMER, DISTRIBUTOR, PROCESSOR]

    UpdateProfileRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
          example: Nguyen Van B

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: farmer@example.com
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: JWT access token
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        name:
          type: string
          example: Nguyen Van A
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        organizationId:
          type: [integer, "null"]
          format: int64
          description: Null until an Admin assigns an organization
        status:
          $ref: "#/components/schemas/AccountStatus"

    CreateBatchRequest:
      type: object
      required: [productName, origin, quantity]
      properties:
        productName:
          type: string
          example: Organic Coffee
        origin:
          type: string
          example: Dak Lak, Vietnam
        quantity:
          type: number
          exclusiveMinimum: 0
          example: 500

    UpdateBatchRequest:
      type: object
      minProperties: 1
      properties:
        productName:
          type: string
        origin:
          type: string
        quantity:
          type: number
          exclusiveMinimum: 0

    Batch:
      type: object
      properties:
        batchId:
          type: integer
          format: int64
        batchCode:
          type: string
          description: Human-readable unique code
          example: BATCH-2026-0001
        productName:
          type: string
          example: Organic Coffee
        origin:
          type: string
          example: Dak Lak, Vietnam
        quantity:
          type: number
          example: 500
        creationDate:
          type: string
          format: date-time
        currentStatus:
          $ref: "#/components/schemas/EventType"
        createdBy:
          type: integer
          format: int64
        organizationId:
          type: integer
          format: int64
          description: Organization that owns the batch

    BatchPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Batch"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    CreateEventRequest:
      type: object
      required: [eventType, location]
      properties:
        eventType:
          type: string
          description: CREATED is written by the system and cannot be sent.
          enum: [TRANSPORTED, RECEIVED, PROCESSED, PACKAGED, SHIPPED]
        location:
          type: string
          example: Ho Chi Minh City
        description:
          type: string
          example: Batch transported to the distribution center.

    SupplyChainEvent:
      type: object
      properties:
        eventId:
          type: integer
          format: int64
        batchId:
          type: integer
          format: int64
        actorId:
          type: integer
          format: int64
        eventType:
          $ref: "#/components/schemas/EventType"
        timestamp:
          type: string
          format: date-time
        location:
          type: string
        description:
          type: string

    QRCode:
      type: object
      properties:
        qrId:
          type: integer
          format: int64
        batchId:
          type: integer
          format: int64
        qrData:
          type: string
          description: URL encoded in the QR image, contains the signed token
          example: https://example.com/trace/<qrToken>
        createdAt:
          type: string
          format: date-time

    Timeline:
      type: object
      properties:
        batch:
          $ref: "#/components/schemas/Batch"
        events:
          type: array
          items:
            $ref: "#/components/schemas/SupplyChainEvent"

    PublicTrace:
      type: object
      description: Public data only. No user ids, emails or internal fields.
      properties:
        batchCode:
          type: string
          example: BATCH-2026-0001
        productName:
          type: string
        origin:
          type: string
        organizationName:
          type: string
          description: Name of the organization that created the batch
        currentStatus:
          $ref: "#/components/schemas/EventType"
        events:
          type: array
          items:
            type: object
            properties:
              eventType:
                $ref: "#/components/schemas/EventType"
              location:
                type: string
              organizationName:
                type: string
                description: Name of the organization of the actor
              timestamp:
                type: string
                format: date-time

    OrganizationType:
      type: string
      enum: [FARM, PROCESSOR, DISTRIBUTOR]

    Organization:
      type: object
      properties:
        organizationId:
          type: integer
          format: int64
        name:
          type: string
          example: Nong trai Dak Lak
        type:
          $ref: "#/components/schemas/OrganizationType"
        address:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateOrganizationRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/OrganizationType"
        address:
          type: string

    UpdateOrganizationRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/OrganizationType"
        address:
          type: string

    UserPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer

    ChangeRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"

    AssignOrganizationRequest:
      type: object
      required: [organizationId]
      properties:
        organizationId:
          type: integer
          format: int64

    ChangeStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, LOCKED]

    AuditAction:
      type: string
      enum: [CREATE, UPDATE, REGISTER, LOGIN_FAILED, APPROVE, CHANGE_ROLE, LOCK, UNLOCK, ASSIGN_ORGANIZATION]

    AuditEntityType:
      type: string
      enum: [USER, ORGANIZATION, BATCH, EVENT, QR_CODE]

    AuditLog:
      type: object
      properties:
        auditId:
          type: integer
          format: int64
        actorId:
          type: [integer, "null"]
          format: int64
          description: Null when the user is unknown (for example a failed login with an unknown email)
        action:
          $ref: "#/components/schemas/AuditAction"
        entityType:
          $ref: "#/components/schemas/AuditEntityType"
        entityId:
          type: [integer, "null"]
          format: int64
        oldValue:
          type: [object, "null"]
        newValue:
          type: [object, "null"]
        createdAt:
          type: string
          format: date-time

    AuditLogPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
