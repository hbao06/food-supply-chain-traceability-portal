services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:3000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: database # tên service bên dưới, khác với localhost khi chạy ngoài Docker
      DB_PORT: 5432
      DB_NAME: food_traceability
      DB_USER: postgres
      DB_PASSWORD: postgres # trùng POSTGRES_PASSWORD của service database
      JWT_SECRET: ${JWT_SECRET} # đặt trong .env ở thư mục gốc (>= 32 ký tự), thiếu thì backend dừng ngay
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      BCRYPT_COST: ${BCRYPT_COST:-10}
      # W7-TV3: khóa ký QR là bí mật của backend (trước đây đặt nhầm ở service frontend nên backend
      # trong Docker không có khóa -> tạo lô lỗi 500, còn container frontend lại giữ bí mật không dùng tới)
      QR_HMAC_SECRET: ${QR_HMAC_SECRET}
      TRACE_BASE_URL: ${TRACE_BASE_URL:-http://localhost:5173}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      - database

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: food_traceability
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # W7-TV3: chỉ mở cho chính máy này (127.0.0.1). "5432:5432" mở cho mọi máy cùng mạng (Wi-Fi trường)
      # trong khi mật khẩu postgres là "postgres". Container backend vẫn kết nối qua mạng nội bộ của Docker.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
